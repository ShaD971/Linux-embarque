name: Buildroot image

on:
  workflow_dispatch:
  push:
    branches: [master, 'modernization/**']
    paths:
      - 'external/**'
      - 'scripts/**'
      - 'Makefile'
      - 'buildroot.version'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'external/**'
      - 'scripts/**'
      - 'Makefile'
      - 'buildroot.version'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      BUILD_JOBS: 2
      FORCE_UNSAFE_CONFIGURE: 1
      SOURCE_DATE_EPOCH: 1543701000
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Validate Buildroot inputs
        shell: bash
        run: |
          set -euo pipefail
          external_dir="$GITHUB_WORKSPACE/external"
          defconfig="$external_dir/configs/linux_embarque_defconfig"
          package_dir="$external_dir/package/lvgl_dashboard"

          echo "Buildroot requested version: $(<buildroot.version)"
          echo "BR2_EXTERNAL=$external_dir"
          echo "=== GIT SUBMODULES ==="
          git submodule status --recursive
          echo "=== CI DEFCONFIG ==="
          cat "$defconfig"

          required_files=(
            "$external_dir/external.desc"
            "$external_dir/external.mk"
            "$external_dir/Config.in"
            "$external_dir/package/Config.in"
            "$package_dir/Config.in"
            "$package_dir/lvgl_dashboard.mk"
            "$package_dir/lvgl_dashboard.hash"
            "$package_dir/src/Makefile"
            "$package_dir/src/main.c"
            "$package_dir/src/lvgl_sources.mk"
          )
          for required_file in "${required_files[@]}"; do
            if [[ ! -f "$required_file" ]]; then
              echo "::error file=${required_file#$GITHUB_WORKSPACE/}::Required Buildroot input is missing"
              exit 1
            fi
          done

          grep -q '^BR2_PACKAGE_LVGL_DASHBOARD=y$' "$defconfig"
          grep -q '^LVGL_DASHBOARD_SITE_METHOD = local$' "$package_dir/lvgl_dashboard.mk"
          grep -q '^LVGL_DASHBOARD_EXTRA_DOWNLOADS = ' "$package_dir/lvgl_dashboard.mk"

      - name: Install Buildroot dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential bash bc binutils bzip2 cpio file gcc git gzip make patch perl python3 rsync sed tar unzip wget xz-utils
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*

      - name: Cache downloads
        uses: actions/cache@v4
        with:
          path: dl
          key: buildroot-dl-${{ hashFiles('buildroot.version', 'external/external.desc', 'external/external.mk', 'external/Config.in', 'external/configs/**', 'external/package/**/Config.in', 'external/package/**/*.mk', 'external/package/**/*.hash') }}

      - name: Prepare Buildroot
        run: bash ./scripts/setup.sh

      - name: Free disk space
        run: |
          echo "=== DISK BEFORE CLEANUP ==="
          df -h || true
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          echo "=== DISK AFTER CLEANUP ==="
          df -h || true

      - name: Add swap when memory is limited
        shell: bash
        run: |
          set -euo pipefail
          memory_kb="$(awk '/MemTotal/ { print $2 }' /proc/meminfo)"
          disk_kb="$(df --output=avail / | tail -n 1)"
          if (( memory_kb < 10 * 1024 * 1024 && disk_kb > 8 * 1024 * 1024 )); then
            sudo swapoff -a || true
            sudo fallocate -l 6G /swapfile
            sudo chmod 600 /swapfile
            sudo mkswap /swapfile
            sudo swapon /swapfile
          else
            echo "Swap creation skipped: sufficient memory or insufficient free disk."
          fi
          free -h

      - name: Configure and diagnose Buildroot
        shell: bash
        run: |
          set -euo pipefail
          make -C buildroot \
            BR2_EXTERNAL="$GITHUB_WORKSPACE/external" \
            O="$GITHUB_WORKSPACE/output" \
            linux_embarque_defconfig

          echo "=== CPU ==="
          nproc
          lscpu || true

          echo "=== MEMORY ==="
          free -h || true

          echo "=== DISK ==="
          df -h || true

          echo "=== BUILDROOT CONFIG ==="
          grep -E 'BR2_(ARCH|ARM|TOOLCHAIN|LIBC|GLIBC|JLEVEL)' output/.config || true

          echo "=== BUILDROOT VERSION ==="
          sed -n 's/^export BR2_VERSION := /Buildroot /p' buildroot/Makefile
          echo "BR2_EXTERNAL=$GITHUB_WORKSPACE/external"

      - name: Build image
        shell: bash
        run: |
          set -o pipefail
          bash ./scripts/build.sh

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build.log
            build-diagnostics/
            logs/
            buildroot.version
            external/configs/linux_embarque_defconfig
            output/.config
            output/build/*/.stamp_*
            output/build/*/config.log
            output/build/*/*.log
            output/host/**/config.log
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14

      - name: Upload successful images
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: linux-embarque-images
          path: output/images/
          if-no-files-found: error
